spring.application.name=leita
spring.profiles.active=${ACTIVE_PROFILE}

logging.level.root=INFO
logging.level.com.leita.leita=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

server.servlet.context-path=/api
server.servlet.allowed-origins=http://localhost:3000,http://localhost:3001,https://dev-client.leita.dev,https://leita.dev,https://dev-server.leita.dev,https://server.leita.dev

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jwt.secret=${JWT_SECRET}
spring.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
spring.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

external-server.judge=${JUDGE_SERVER_URL}
external-server.slack=${SLACK_WEBHOOK_URL}
external-server.github=https://api.github.com
external-server.google=https://www.googleapis.com/oauth2/v3

github.app-id=${GITHUB_APP_ID}
github.private-key=${GITHUB_PRIVATE_KEY}

oci.bucket-name=${OCI_BUCKET_NAME}
oci.namespace=${OCI_NAMESPACE}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
leita.redis.judge-stream=${JUDGE_STREAM_KEY:judge-result-stream}
